[package]
name = "bdk_chain"
version = "0.23.2"
edition = "2021"
rust-version = "1.85.0"
homepage = "https://bitcoindevkit.org"
repository = "https://github.com/bitcoindevkit/bdk"
documentation = "https://docs.rs/bdk_chain"
description = "Collection of core structures for Bitcoin Dev Kit."
license = "MIT OR Apache-2.0"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[dependencies]
bitcoin = { package = "litecoin", version = "0.32.8-rc.2", default-features = false }
bdk_core = { path = "../core", version = "0.6.2", default-features = false }
serde = { version = "1", optional = true, features = ["derive", "rc"] }
miniscript = { git = "https://github.com/LitecoinDevKit/rust-miniscript", rev = "e3187272617adad69f5b9ece62d25ea28b70fd25", optional = true, default-features = false }

# Feature dependencies
rusqlite = { version = "0.31.0", features = ["bundled"], optional = true }

[dev-dependencies]
rand = "0.8"
proptest = "1.2.0"
bdk_testenv = { path = "../testenv", features = ["litecoin-daemon"] }
criterion = { version = "0.7" }

[features]
default = ["std", "miniscript"]
# Forward `no-std` for the 12.x Litecoin miniscript fork (requires std XOR no-std).
# Safe alongside `std` → `miniscript?/std` when both features are enabled.
miniscript = ["dep:miniscript", "miniscript/no-std"]
std = ["bitcoin/std", "miniscript?/std", "bdk_core/std"]
serde = ["dep:serde", "bitcoin/serde", "miniscript?/serde", "bdk_core/serde"]
hashbrown = ["bdk_core/hashbrown"]
rusqlite = ["std", "dep:rusqlite", "serde"]

[[bench]]
name = "canonicalization"
harness = false

[[bench]]
name = "indexer"
harness = false
