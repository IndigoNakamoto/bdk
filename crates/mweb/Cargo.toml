[package]
name = "bdk_mweb"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
homepage = "https://bitcoindevkit.org"
repository = "https://github.com/IndigoNakamoto/bdk"
documentation = "https://docs.rs/bdk_mweb"
description = "MWEB (MimbleWimble Extension Blocks) primitives for Litecoin BDK."
license = "MIT OR Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[dependencies]
bitcoin = { package = "litecoin", version = "0.32.8-rc.1", default-features = false }
blake3 = { version = "1.5", default-features = false }
secp256k1-zkp = { version = "0.11.0", default-features = false, optional = true }

[dev-dependencies]
bitcoin = { package = "litecoin", version = "0.32.8-rc.1", default-features = false, features = ["std", "rand-std"] }
hex-conservative = "0.2"
serde_json = "1"
bdk_testenv = { path = "../testenv", features = ["litecoin-daemon"] }

[features]
default = ["std", "zkp"]
std = ["bitcoin/std", "blake3/std", "secp256k1-zkp?/std", "secp256k1-zkp?/rand-std"]
# Elements secp256k1-zkp façade (Phase 2 smoke tests). Phase 4 may switch to Core-vendored FFI.
zkp = ["dep:secp256k1-zkp"]
