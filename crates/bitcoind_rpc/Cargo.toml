[package]
name = "bdk_bitcoind_rpc"
version = "0.22.0"
edition = "2021"
rust-version = "1.85.0"
homepage = "https://bitcoindevkit.org"
repository = "https://github.com/LitecoinDevKit/bdk"
documentation = "https://docs.rs/bdk_bitcoind_rpc"
description = "This crate is used for emitting blockchain data from the `bitcoind` RPC interface."
license = "MIT OR Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[dependencies]
bitcoin = { package = "litecoin", version = "0.32.8-rc.2", default-features = false }
# Vendored Litecoin alias of rust-bitcoin/rust-bitcoincore-rpc @ 0.19.0 (see vendor/bitcoincore-rpc).
bitcoincore-rpc = { path = "../../vendor/bitcoincore-rpc/client", version = "0.19.0" }
bdk_core = { path = "../core", version = "0.6.2", default-features = false }

[dev-dependencies]
bdk_bitcoind_rpc = { path = "." }
bdk_testenv = { path = "../testenv", features = ["litecoin-daemon"] }
bdk_chain = { path = "../chain" }

[features]
default = ["std"]
std = ["bitcoin/std", "bdk_core/std"]
serde = ["bitcoin/serde", "bdk_core/serde"]

[[example]]
name = "filter_iter"
required-features = ["std"]
