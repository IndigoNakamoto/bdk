name: Fuzz

# Scheduled rather than per-PR (F-Z, SECURITY_PLAN "Fuzzing plan"): a bounded
# honggfuzz run costs tens of minutes and its value is continuous background
# coverage, not gating individual changes. It also runs when the harness itself
# changes, so a broken target or seed corpus is caught at the PR that broke it.
on:
  schedule:
    - cron: '0 4 * * 1,4' # Mondays and Thursdays 04:00 UTC
  push:
    paths:
      - '.github/workflows/fuzz.yml'
      - 'crates/mweb/fuzz/**'
  pull_request:
    paths:
      - '.github/workflows/fuzz.yml'
      - 'crates/mweb/fuzz/**'
  workflow_dispatch:
    inputs:
      run_time:
        description: 'Seconds of fuzzing per target'
        required: false
        default: '60'

permissions: {}

jobs:
  fuzz:
    name: honggfuzz (all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Scheduled runs get a longer budget than harness-change smoke runs.
      RUN_TIME: ${{ github.event_name == 'schedule' && '180' || github.event.inputs.run_time || '30' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-workspaces: crates/mweb/fuzz
      - name: Install honggfuzz system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-dev libunwind-dev libblocksruntime-dev liblzma-dev
      - name: Harness self-test (sweep + seed regeneration)
        working-directory: crates/mweb/fuzz
        run: |
          cargo test
          cargo run --bin gen_corpus
          # `git diff` alone misses seeds the generator creates that were never
          # checked in, so also require a clean status for the corpus tree.
          if ! git diff --exit-code -- hfuzz_input || [ -n "$(git status --porcelain hfuzz_input)" ]; then
            echo "::error::checked-in seed corpus is stale; run 'just fuzz-corpus' and commit"
            exit 1
          fi
      - name: Fuzz every target
        run: crates/mweb/fuzz/fuzz.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hfuzz-workspace
          path: crates/mweb/fuzz/hfuzz_workspace/
          if-no-files-found: ignore
