[workspace]
resolver = "2"
members = [
    "crates/chain",
    "crates/core",
    "crates/file_store",
    "crates/electrum",
    "crates/esplora",
    "crates/mweb",
    "crates/testenv",
    "examples/ltc-scan",
]
# `crates/bitcoind_rpc` is not part of this fork yet: it needs a Litecoin build of
# `bitcoincore-rpc`, which does not exist for the 0.19 series. See PORTING.md.
# `bdk_wallet` is a nested clone of the separate IndigoNakamoto/bdk_wallet fork.
exclude = ["crates/bitcoind_rpc", "bdk_wallet"]

[workspace.package]
authors = ["Bitcoin Dev Kit Developers"]

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"

[workspace.lints.rust]
# `daemon_tests` enables tests that need the `bitcoind` + `electrs` harness. It is a cfg rather
# than a feature so that `--all-features` builds stay clean while the harness is Bitcoin-only.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)', 'cfg(daemon_tests)'] }
