[workspace]
resolver = "2"
members = [
    "crates/chain",
    "crates/core",
    "crates/file_store",
    "crates/electrum",
    "crates/esplora",
    "crates/mweb",
    "crates/bitcoind_rpc",
    "crates/testenv",
    "examples/ltc-scan",
]
# `bdk_wallet` is a nested clone of the separate LitecoinDevKit/bdk_wallet fork.
# `vendor/bitcoincore-rpc` is its own Cargo workspace (path dep of bdk_bitcoind_rpc).
# `crates/mweb/fuzz` needs its own release profile (overflow checks on).
exclude = ["bdk_wallet", "bdk-ffi", "vendor/bitcoincore-rpc", "crates/mweb/fuzz"]

[workspace.package]
authors = ["Bitcoin Dev Kit Developers"]

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"

[workspace.lints.rust]
# `daemon_tests` enables tests that need the `bitcoind` + `electrs` harness. It is a cfg rather
# than a feature so that `--all-features` builds stay clean while the harness is Bitcoin-only.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)', 'cfg(daemon_tests)'] }

# Until crates.io publishes litecoin 0.32.8-rc.2 (native PSBTv2 MWEB maps).
# v24-rmweb: Core v24 regtest MWEB HRP + LIP-0007 PSBTv2. Do not merge to litecoin until CI pins v24.
[patch.crates-io]
litecoin = { git = "https://github.com/LitecoinDevKit/rust-litecoin.git", rev = "2e4577f49243b9e9bf1dfc904b8e6b6702827aae" }
